
services:
  db:
    build:
      context: ./db-image
    image: documind-postgres-pgvector:16
    environment:
      POSTGRES_DB: ragdb
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ragpassword
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raguser -d ragdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  django:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - ~/.cache/huggingface:/root/.cache/huggingface
      - media-data:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build: .
    command: celery -A core worker -l info
    volumes:
      - .:/app
      - media-data:/app/media
      - ~/.cache/huggingface:/root/.cache/huggingface
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  drive_service:
    build:
      context: .
      dockerfile: drive_service/Dockerfile
    volumes:
      - ./drive_service:/app
      - ./apps:/app/apps
      - ./Workflow:/app/Workflow
      - ./RagCore:/app/RagCore
      - ./core:/app/core
      - ./manage.py:/app/manage.py
      - media-data:/app/media
      - ~/.cache/huggingface:/root/.cache/huggingface
    ports:
      - "8001:8001"
    env_file:
      - .env
      - ./drive_service/.env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings
      DB_HOST: db
      DB_PORT: "5432"
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - django

volumes:
  postgres-data:
  media-data: